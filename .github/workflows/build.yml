name: ZharVe1L Kernel Builder (Advanced)

on:
  workflow_dispatch:
    inputs:
      LTO:
        description: 'Link Time Optimization Mode'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - thin

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        ref: 'test'
        fetch-depth: 0
        submodules: 'recursive'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison ccache cpio curl flex git libssl-dev lz4 perl python-is-python3 tar wget zstd zip

    - name: Cache Toolchain
      uses: actions/cache@v4
      with:
        path: toolchain/
        # Bump this key when the toolchain URLs or revisions in build_kernel.sh change.
        key: ${{ runner.os }}-toolchain-neutron-26052026-kud-gcc49-v1

    - name: Cache Ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-ccache-neutron-26052026-kud-gcc49-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-neutron-26052026-kud-gcc49-

    - name: Get Build Metadata
      id: build-meta
      run: |
        COMMIT_TITLE="$(git log -1 --pretty=%s | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g' | cut -c1-60)"
        if [ -z "${COMMIT_TITLE}" ]; then
          COMMIT_TITLE="unknown-commit"
        fi
        echo "commit_title=${COMMIT_TITLE}" >> "${GITHUB_OUTPUT}"

    - name: Execute Main Build Script
      env:
        LTO: ${{ github.event.inputs.LTO }}
      run: |
        chmod +x build_kernel.sh
        bash build_kernel.sh

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZharVe1L-Kernel-A235F-${{ github.event.inputs.LTO }}-${{ steps.build-meta.outputs.commit_title }}-run-${{ github.run_number }}
        path: Image.gz
