name: ZharVe1L Kernel Builder (Advanced)

on:
  workflow_dispatch:
    inputs:
      LTO:
        description: 'Link Time Optimization Mode'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - thin

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        ref: 'test'
        fetch-depth: 0
        submodules: 'recursive'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison ccache cpio curl flex git libssl-dev lz4 perl python-is-python3 tar wget zstd zip

    - name: Cache Toolchain
      uses: actions/cache@v4
      with:
        path: toolchain/
        # Bump this key when the toolchain URLs or revisions in build_kernel.sh change.
        key: ${{ runner.os }}-toolchain-neutron-26052026-kud-gcc49-v1

    - name: Cache Ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-ccache-neutron-26052026-kud-gcc49-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-neutron-26052026-kud-gcc49-

    - name: Get Build Metadata
      id: build-meta
      run: |
        COMMIT_TITLE="$(git log -1 --pretty=%s | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g' | cut -c1-60)"
        if [ -z "${COMMIT_TITLE}" ]; then
          COMMIT_TITLE="unknown-commit"
        fi
        echo "commit_title=${COMMIT_TITLE}" >> "${GITHUB_OUTPUT}"

    - name: Execute Main Build Script
      env:
        LTO: ${{ github.event.inputs.LTO }}
      run: |
        chmod +x build_kernel.sh
        bash build_kernel.sh

    - name: Record Build Metadata
      env:
        LTO: ${{ github.event.inputs.LTO }}
      run: |
        set -euo pipefail
        {
          echo "Build time (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Kernel commit: $(git rev-parse HEAD)"
          echo "Kernel commit title: $(git log -1 --pretty=%s)"
          echo "BakaSU commit: $(git -C KernelSU rev-parse HEAD)"
          echo "LTO: ${LTO}"
          echo
          echo "Clang:"
          toolchain/clang/bin/clang --version
          echo
          echo "AArch64 GCC:"
          toolchain/gcc/aarch64/bin/aarch64-linux-android-gcc --version | head -n 1
          echo "AArch64 GCC commit: $(git -C toolchain/gcc/aarch64 rev-parse HEAD)"
          echo
          echo "ARM32 GCC:"
          toolchain/gcc/arm/bin/arm-linux-androideabi-gcc --version | head -n 1
          echo "ARM32 GCC commit: $(git -C toolchain/gcc/arm rev-parse HEAD)"
        } | tee build-metadata.txt

    - name: Package Flashable AnyKernel
      id: package
      env:
        LTO: ${{ github.event.inputs.LTO }}
        COMMIT_TITLE: ${{ steps.build-meta.outputs.commit_title }}
      run: |
        set -euo pipefail
        PACKAGE_NAME="ZharVe1L-Kernel-A235F-${LTO}-${COMMIT_TITLE}-run-${GITHUB_RUN_NUMBER}.zip"
        RELEASE_TITLE="ZharVe1L Kernel A235F ${LTO} ${COMMIT_TITLE} run-${GITHUB_RUN_NUMBER}"
        RELEASE_TAG="anykernel-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
        TARGET_COMMIT="$(git rev-parse HEAD)"
        PACKAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/anykernel.XXXXXX")"
        trap 'rm -rf "${PACKAGE_DIR}"' EXIT
        cp -a .external/. "${PACKAGE_DIR}/"
        cp Image build-metadata.txt "${PACKAGE_DIR}/"
        chmod 755 "${PACKAGE_DIR}/META-INF/com/google/android/update-binary"
        (
          cd "${PACKAGE_DIR}"
          zip -qr "${GITHUB_WORKSPACE}/${PACKAGE_NAME}" .
        )
        echo "package_name=${PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"
        echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"
        echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
        echo "target_commit=${TARGET_COMMIT}" >> "${GITHUB_OUTPUT}"

    - name: Publish Flashable Release
      env:
        GH_TOKEN: ${{ github.token }}
        PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
        RELEASE_TITLE: ${{ steps.package.outputs.release_title }}
        RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
        TARGET_COMMIT: ${{ steps.package.outputs.target_commit }}
      run: |
        gh release create "${RELEASE_TAG}" "${PACKAGE_NAME}" \
          --title "${RELEASE_TITLE}" \
          --notes "Flashable AnyKernel ZIP. Build commit: ${TARGET_COMMIT}." \
          --target "${TARGET_COMMIT}" \
          --prerelease
