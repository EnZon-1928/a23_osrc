name: ZharVe1L Kernel Builder (Advanced)

on:
  workflow_dispatch:
    inputs:
      LTO:
        description: 'Link Time Optimization Mode'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - thin

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        ref: 'experiment'
        fetch-depth: 0
        submodules: 'recursive'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison ccache cpio curl flex git libssl-dev lz4 perl python-is-python3 tar wget zstd zip

    - name: Setup Ccache and Toolchain Environment
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ccache
          toolchain/
        key: ${{ runner.os }}-build-cache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-cache-

    - name: Execute Main Build Script
      env:
        LTO: ${{ github.event.inputs.LTO }}
      run: |
        chmod +x build_kernel.sh
        bash build_kernel.sh

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZharVe1L-Kernel-A235F
        path: Image.gz